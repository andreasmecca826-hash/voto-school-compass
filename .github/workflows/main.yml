
name: VOTO - Build web

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Bun
        uses: oven-sh/setup-bun@v2

      - name: Installa dipendenze
        run: bun install --frozen-lockfile

      - name: Compila VOTO
        run: bun run build

      - name: Mostra cartelle generate
        run: |
          echo "Cartella corrente:"
          pwd
          echo "File generati:"
          find . -maxdepth 3 -type d \( -name dist -o -name build -o -name .output \) -print

      - name: Carica file generati
        uses: actions/upload-artifact@v4
        with:
        include-hidden-files: true
          name: VOTO-build-debug
          path: |
            dist/**
            build/**
            .output/**
          if-no-files-found: error
