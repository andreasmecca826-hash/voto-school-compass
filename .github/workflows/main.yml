
name: VOTO - Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Bun
        uses: oven-sh/setup-bun@v2

      - name: Installa dipendenze
        run: bun install --frozen-lockfile

      - name: Compila VOTO
        run: bun run build

      
      - name: Conserva la versione web compilata
        uses: actions/upload-artifact@v4
        with:
          name: VOTO-web-build
          path: |
            dist/
            build/
          if-no-files-found: warn
