name: Deploy Supabase Edge Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Deploy mirror-circular
        run: supabase functions deploy mirror-circular --project-ref jmvxuhgjejzpezvawzfw
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configure trigger secret and deploy circular-check function
        run: |
          if [ -z "$VOTO_CIRCULAR_TRIGGER_TOKEN" ]; then
            echo "::error::Aggiungi il secret VOTO_CIRCULAR_TRIGGER_TOKEN al repository voto-school-compass."
            exit 1
          fi
          supabase secrets set "VOTO_CIRCULAR_TRIGGER_TOKEN=$VOTO_CIRCULAR_TRIGGER_TOKEN" --project-ref jmvxuhgjejzpezvawzfw
          supabase functions deploy request-circular-check --no-verify-jwt --project-ref jmvxuhgjejzpezvawzfw
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VOTO_CIRCULAR_TRIGGER_TOKEN: ${{ secrets.VOTO_CIRCULAR_TRIGGER_TOKEN }}
